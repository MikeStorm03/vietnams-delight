modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
sources="https://github.com/MikeStorm03/vietnams-delight"
issueTrackerURL="https://github.com/MikeStorm03/vietnams-delight/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL="https://modrinth.com/project/vietnams-delight-reborn"
logoFile="${mod_id}_banner.png"
credits="${credits}"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "farmersdelight"
type="required"
versionRange="[1, )"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "custombrewrecipes"
type="required"
versionRange="[1, )"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "corn_delight"
type="optional"
versionRange="[1, )"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "coffee_delight"
type="discouraged"
versionRange="[1, )"
ordering = "NONE"
side = "BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
